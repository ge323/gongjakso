<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🌙 지금 깨어 있는 사람</title>
  <meta name="description" content="들어오면 창문에 불이 하나 켜져요 | 아이디어 공작소 #3">

  <!-- 링크 공유 시 미리보기 (카톡, 인스타 등) -->
  <meta property="og:title" content="🌙 지금 깨어 있는 사람">
  <meta property="og:description" content="들어오면 창문에 불이 하나 켜져요. 지금 몇 명이 깨어 있을까?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ge323.github.io/gongjakso/awake/">
  <meta property="og:image" content="https://ge323.github.io/gongjakso/awake/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard (윈도우에서도 또렷하게) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=9">
  <!-- DB (Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sound.js?v=2" defer></script>
  <script src="script.js?v=10" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="badge">아이디어 공작소 #3</p>
      <h1 class="title">🌙 지금 깨어 있는 사람</h1>
      <p class="subtitle">들어오면 창문에 불이 하나 켜져요</p>
    </header>

    <!-- 아파트 단지 -->
    <section class="town-wrap">
      <!-- 무드등 모드일 때만 보임 -->
      <div id="moodTop" class="mood-top" hidden>
        <button id="moodExit" class="mood-exit" type="button" aria-label="무드등 끄기">✕</button>
      </div>
      <div class="town-view">
        <!-- 하늘 위에 띄우는 시계·타이머·날씨 -->
        <div class="hud" aria-live="off">
          <div class="hud-top">
            <span id="hudClock" class="hud-clock">--:--</span>
            <span id="hudDate" class="hud-date"></span>
          </div>
          <p id="hudSun" class="hud-line"></p>
          <p id="hudTimer" class="hud-line"></p>
        </div>
        <button id="soundBtn" class="sound-btn" type="button" aria-pressed="false">♪ 소리 켜기</button>
        <div id="scroller" class="scroller">
          <canvas id="town" class="town" width="720" height="960" aria-label="불 켜진 창문이 있는 밤의 아파트 단지"></canvas>
        </div>
      </div>
      <div class="town-bar">
        <span id="nowCount" class="now-count">불 켜는 중…</span>
        <button id="findBtn" class="find-btn" type="button" hidden>📍 내 창문</button>
      </div>
      <div class="sub-bar">
        <span id="dayCount" class="day-count"></span>
      </div>

      <!-- 창문을 눌렀을 때 -->
      <div id="peek" class="peek" hidden>
        <div class="peek-text">
          <p id="peekAddr" class="peek-addr"></p>
          <p id="peekState" class="peek-state"></p>
        </div>
        <button id="waveBtn" class="wave-btn" type="button">👋 손 흔들기</button>
        <button id="moveBtn" class="move-btn" type="button" hidden>🏠 여기로 이사</button>
      </div>
    </section>

    <!-- 단지 공동 목표 -->
    <section id="goal" class="goal" hidden>
      <div class="goal-top">
        <span id="goalTitle" class="goal-title"></span>
        <span id="goalCount" class="goal-count"></span>
      </div>
      <div class="goal-bar"><div id="goalFill" class="goal-fill"></div></div>
      <p id="goalNext" class="goal-next"></p>
    </section>

    <!-- 내 창문 -->
    <section id="mine" class="mine" hidden>
      <div class="mine-top">
        <p class="mine-title">🪟 내 창문 <b id="myAddr"></b></p>
        <p id="myWaves" class="mine-visits"></p>
      </div>

      <div class="field">
        <p class="label">조명 색</p>
        <div id="colors" class="swatches"></div>
      </div>

      <div class="field">
        <p class="label">지금 뭐 해요?</p>
        <div id="statuses" class="chips"></div>
      </div>

      <p id="growth" class="growth"></p>
      <p class="move-hint">빈 창문을 누르면 이사할 수 있어요 (하루 1번)</p>
      <p class="move-hint"><span id="skyWhere">하늘·날씨: 서울 기준</span> · <button id="skyToggle" class="link-btn" type="button">내 위치로 보기</button></p>
    </section>

    <div class="actions">
       <button id="moodBtn" class="btn btn-main" type="button">화면 켜 두기</button>
      <p class="move-hint">화면이 꺼지지 않게 해서 시간이 계속 쌓여요</p>
      <button id="shareBtn" class="btn btn-sub" type="button">📋 내 창문 알려주기</button>
    </div>

    <footer class="footer">
      <p>화면이 켜져 있는 동안만 시간이 쌓여요 · 하루는 새벽 6시에 바뀌어요</p>
      <p>위치는 이 기기에만 저장하고 날씨 조회에만 대략(약 10km) 써요 · 날씨 정보 <a class="credit" href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
      <p>의뢰: 공작소장 · 🛠️ 아이디어 공작소</p>
      <p><a class="home-link" href="https://ge323.github.io/gongjakso/">다른 공작품 보러가기 →</a></p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
