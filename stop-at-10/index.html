<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>⏱️ 딱 10초</title>
    <meta
      name="description"
      content="눈 감고 정확히 10초에 멈출 수 있을까? | 아이디어 공작소 #1"
    />

    <!-- 링크 공유 시 미리보기 (카톡, 인스타 등) -->
    <meta property="og:title" content="⏱️ 딱 10초" />
    <meta
      property="og:description"
      content="정확히 10초에 멈출 수 있을까? 지금 도전해보세요!"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ge323.github.io/gongjakso/stop-at-10/"
    />
    <meta
      property="og:image"
      content="https://ge323.github.io/gongjakso/stop-at-10/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="style.css" />
    <!-- 랭킹 DB (Supabase) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="badge">아이디어 공작소 #1</p>
        <h1 class="title">⏱️ 딱 10초</h1>
        <p class="subtitle">
          3초 뒤 타이머가 사라집니다.<br />감으로 정확히 <strong>10초</strong>에
          멈추세요!
        </p>
      </header>

      <section class="stage">
        <div id="timer" class="timer">0.00</div>
        <p id="hint" class="hint">
          시작 버튼을 누르거나 스페이스바를 눌러주세요
        </p>

        <!-- 결과 영역 -->
        <div id="result" class="result" hidden>
          <p id="grade" class="grade"></p>
          <p id="diff" class="diff"></p>
          <p id="best" class="best"></p>
        </div>
      </section>

      <div class="actions">
        <button id="mainBtn" class="btn btn-main" type="button">START</button>

        <!-- 랭킹 등록 폼 (결과가 나오면 보임) -->
        <form id="rankForm" class="rank-form" hidden>
          <input
            id="nickname"
            class="rank-input"
            type="text"
            maxlength="12"
            placeholder="닉네임 (최대 12자)"
            autocomplete="off"
            required
          />
          <button id="submitBtn" class="btn btn-submit" type="submit">
            랭킹 등록
          </button>
        </form>
        <p id="myRank" class="my-rank" hidden></p>

        <button id="shareBtn" class="btn btn-sub" type="button" hidden>
          📋 결과 공유하기
        </button>
      </div>

      <!-- 랭킹 보드 -->
      <section id="ranking" class="ranking">
        <div class="ranking-header">
          <h2>🏆 랭킹 TOP 10</h2>
          <button
            id="refreshBtn"
            class="refresh-btn"
            type="button"
            aria-label="랭킹 새로고침"
          >
            ↻
          </button>
        </div>
        <!-- 명예의 전당: 최초 인간 시계 달성자 (항상 맨 위 고정) -->
        <div id="hof" class="hof" hidden></div>
        <ol id="rankList" class="rank-list">
          <li class="rank-empty">불러오는 중...</li>
        </ol>
      </section>

      <footer class="footer">
        <p>의뢰: 공작소장 · 🛠️ 아이디어 공작소</p>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
