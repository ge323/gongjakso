<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛠️ 아이디어 공작소</title>
    <meta
      name="description"
      content="상상만 하던 사이트, 대신 만들어드립니다 | 댓글로 의뢰받은 아이디어를 웹 게임·사이트로 만들어요"
    />
    <meta property="og:title" content="🛠️ 아이디어 공작소" />
    <meta
      property="og:description"
      content="상상만 하던 사이트, 대신 만들어드립니다"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ge323.github.io/gongjakso/" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --line: #252932;
        --text: #f2f3f5;
        --muted: #8b909a;
        --accent: #4ade80;
      }

      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Pretendard",
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        display: flex;
        justify-content: center;
      }

      .app {
        width: 100%;
        max-width: 480px;
        padding: 40px 20px 32px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      /* 헤더 */
      .header {
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 16px;
      }

      .title {
        font-size: 30px;
        font-weight: 800;
        line-height: 1.35;
        margin-bottom: 10px;
      }

      .title em {
        font-style: normal;
        color: var(--accent);
      }

      .subtitle {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      /* 공작품 목록 */
      .section-title {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px;
        border-radius: 20px;
        background: var(--card);
        border: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }

      a.item:hover,
      a.item:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        outline: none;
      }

      .icon {
        flex-shrink: 0;
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: #252932;
        display: grid;
        place-items: center;
        font-size: 32px;
      }

      .info {
        flex: 1;
        min-width: 0;
      }

      .no {
        font-size: 12px;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 2px;
      }

      .name {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .desc {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }

      .tags {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }

      .tag {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        background: #252932;
        color: #c9ccd2;
      }

      .go {
        flex-shrink: 0;
        font-size: 20px;
        color: var(--muted);
      }

      /* 준비 중 카드 */
      .item.is-locked {
        border-style: dashed;
        opacity: 0.75;
      }

      .item.is-locked .icon {
        filter: blur(3px);
      }

      /* 의뢰 안내 */
      .request {
        text-align: center;
        padding: 22px;
        border-radius: 20px;
        background: rgba(74, 222, 128, 0.08);
        border: 1px solid rgba(74, 222, 128, 0.25);
      }

      .request h2 {
        font-size: 18px;
        margin-bottom: 6px;
      }

      .request p {
        font-size: 14px;
        color: #c9ccd2;
        line-height: 1.6;
      }

      /* 푸터 */
      .footer {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }

      .footer a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <span class="badge">🛠️ 아이디어 공작소</span>
        <h1 class="title">
          상상만 하던 사이트,<br /><em>대신 만들어드립니다</em>
        </h1>
        <p class="subtitle">
          댓글로 의뢰받은 아이디어를<br />웹 게임과 사이트로 만들어요
        </p>
      </header>

      <section>
        <h2 class="section-title">🧰 공작품</h2>
        <div class="list">
          <!-- 공작 #2 (최신이 위로) -->
          <a class="item" href="https://ge323.github.io/gongjakso/pixel-fish/">
            <div class="icon">🐟</div>
            <div class="info">
              <p class="no">공작 #2 · NEW</p>
              <p class="name">픽셀 어항</p>
              <p class="desc">
                내가 만든 물고기가 모두의 어항에서 계속 헤엄쳐요
              </p>
              <div class="tags">
                <span class="tag">🫧 참여형</span>
                <span class="tag">🎨 꾸미기</span>
              </div>
            </div>
            <span class="go">›</span>
          </a>

          <!-- 공작 #1 -->
          <a class="item" href="https://ge323.github.io/gongjakso/stop-at-10/">
            <div class="icon">⏱️</div>
            <div class="info">
              <p class="no">공작 #1</p>
              <p class="name">딱 10초</p>
              <p class="desc">
                타이머가 사라진 뒤, 감으로 정확히 10초에 멈출 수 있을까?
              </p>
              <div class="tags">
                <span class="tag">🎮 게임</span>
                <span class="tag">🏆 랭킹</span>
              </div>
            </div>
            <span class="go">›</span>
          </a>
        </div>
      </section>

      <section class="request">
        <h2>📮 공작 의뢰 받는 중</h2>
        <p>
          "이런 사이트 있으면 좋겠다" 싶은 게 있다면<br />영상 댓글로
          남겨주세요!
        </p>
      </section>

      <footer class="footer">
        <p>🛠️ 아이디어 공작소</p>
        <p>
          <a
            href="https://github.com/ge323/gongjakso"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
        </p>
        <p id="visit-count" hidden style="font-size: 0.8rem; opacity: 0.6"></p>
      </footer>
    </main>
  </body>
</html>
